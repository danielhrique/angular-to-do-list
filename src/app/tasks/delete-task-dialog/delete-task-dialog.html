<h2 mat-dialog-title id="delete-dialog-title">Confirmar exclusão</h2>

<mat-dialog-content id="delete-dialog-description">
  <p>
    Você tem certeza que deseja excluir a tarefa:
    <strong>{{ data.taskTitle }}</strong>?
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton="outlined" [mat-dialog-close]="false">
    Cancelar
  </button>

  <button matButton="filled" [mat-dialog-close]="true">
    Excluir
  </button>
</mat-dialog-actions>
